name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24]
        include:
          - os: windows-latest
            node: 24
          - os: macos-latest
            node: 24
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node src/cli.ts install-browser ${{ runner.os == 'Linux' && '--with-deps' || '' }}
      - run: npm run check
      - run: npm run build
      - run: node dist/cli.js --version

  action:
    # The GitHub Action, run from this checkout against the example game.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          version: source
          working-directory: examples/jumper
          args: --only title,jump,devices
