<!doctype html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<style>html, body { margin: 0; height: 100%; overflow: hidden; background: #000; } canvas { display: block; width: 100%; height: 100%; touch-action: none; }</style></head>
<body><canvas id="c"></canvas>
<script>
  // Loads its level after a short splash, the way many games do: a timer, then a fetch, then frames.
  const c = document.getElementById("c"), g = c.getContext("2d");
  c.width = innerWidth; c.height = innerHeight;
  window.level = null;
  window.loadedAt = null;
  setTimeout(async () => {
    const response = await fetch("level.json");
    window.level = await response.json();
    window.loadedAt = performance.now();
  }, 300);
  function frame() {
    g.fillStyle = window.level ? window.level.color : "#333";
    g.fillRect(0, 0, c.width, c.height);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.playproof = { ready: () => window.level !== null };
</script></body></html>
