<!doctype html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<style>html, body { margin: 0; height: 100%; overflow: hidden; } canvas { display: block; width: 100%; height: 100%; touch-action: none; }</style></head>
<body><canvas id="c"></canvas>
<script>
  // The fifth tap enters an endless loop, like a physics solver that never converges.
  const c = document.getElementById("c"), g = c.getContext("2d");
  c.width = innerWidth; c.height = innerHeight;
  let taps = 0;
  c.addEventListener("pointerdown", () => { taps++; if (taps === 5) { for (;;) {} } });
  function frame(t) { g.fillStyle = `hsl(${(t / 10) % 360} 60% 40%)`; g.fillRect(0, 0, c.width, c.height); requestAnimationFrame(frame); }
  requestAnimationFrame(frame);
</script></body></html>
